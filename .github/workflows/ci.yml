# Nombre del flujo de trabajo
name: Integracion continua

# Ejecuta el flujo cuando enviamos cambios a GitHub
on:
    push:
    pull_request:

# Permisos necesarios para leer el repositorio
permissions:
    contents: read

# Trabajos que ejecutara GitHub Actions
jobs:
    verificar-javascript:
        runs-on: ubuntu-latest

        steps:
            # Descarga el codigo del repositorio
            - name: Obtener codigo
              uses: actions/checkout@v6

            # Configura Node.js para comprobar los archivos
            - name: Configurar Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false

            # Comprueba la sintaxis de nuestros archivos JS
            - name: Verificar sintaxis JavaScript
              run: |
                  find js -type f -name "*.js" -exec node --check {} \;
